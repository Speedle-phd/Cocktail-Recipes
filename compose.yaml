services:
  app:
    build:
      context: .
      target: production
    environment:
      PORT: "${PORT:-8080}"
    ports:
      - "127.0.0.1:${PORT:-8080}:${PORT:-8080}"
    restart: unless-stopped

  dev:
    profiles:
      - dev
    build:
      context: .
      target: development
    ports:
      - "127.0.0.1:${DEV_PORT:-5173}:5173"
    environment:
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - .:/app
      - app_node_modules:/app/node_modules
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0 --port 5173 --strictPort"

volumes:
  app_node_modules:
